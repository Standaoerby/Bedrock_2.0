{% extends "base.html" %}
{% block title %}Pigs — Bedrock Admin{% endblock %}
{% block body %}
<h1>Pigs</h1>
<p class="muted">Reset progress bars. Values are 0..1; the panel renders them as percentage fills.</p>

<form method="post" class="card">
    {% for key, label in [('water','Water'),('food','Food'),('clean','Cleaning')] %}
    <label class="block">
        <span>{{ label }}</span>
        <input type="range" name="{{ key }}" min="0" max="1" step="0.01"
               value="{{ pigs[key] if pigs[key] is defined else 1.0 }}"
               oninput="this.nextElementSibling.value = parseFloat(this.value).toFixed(2)">
        <output>{{ '%.2f' % (pigs[key] if pigs[key] is defined else 1.0) }}</output>
    </label>
    {% endfor %}
    <div class="row">
        <button class="btn-primary" type="submit">Save</button>
    </div>
</form>
{% endblock %}
