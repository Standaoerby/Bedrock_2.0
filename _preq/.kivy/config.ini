[graphics]
# Display configuration for 1024x600 touchscreen on Raspberry Pi 5
width = 1024
height = 600
fullscreen = 1
borderless = 1
resizable = 0
show_cursor = 0
position = custom
left = 0
top = 0

# Performance optimizations for Pi5 VideoCore VII GPU
maxfps = 60
multisamples = 0
vsync = 1
allow_screensaver = 0

# Window management for X11
window_state = maximized
minimum_width = 1024
minimum_height = 600

# Display scaling (important for Pi5)
display = -1
density = 1.0

[input]
# Mouse configuration (includes touchscreen input)
mouse = mouse
%(name)s = probesysfs,provider=mouse

# Touch device configuration for capacitive touchscreens
mtdev_%(name)s = probesysfs,provider=mtdev
hid_%(name)s = probesysfs,provider=hidinput

[kivy]
# Logging configuration
log_level = info
log_enable = 1
log_dir = logs
log_name = kivy_%y-%m-%d_%_.txt
log_maxfiles = 10

# Desktop mode for proper window handling on Pi5
desktop = 1
exit_on_escape = 1

# Window and GL providers optimized for Pi5
window = sdl2
keyboard = sdl2

# OpenGL configuration for VideoCore VII
opengl_api = auto

[postproc]
# Touch processing optimized for responsive touch
double_tap_time = 250
double_tap_distance = 20
triple_tap_time = 375
triple_tap_distance = 20

[widgets]
# Widget scroll settings for smooth touch scrolling
scroll_timeout = 250
scroll_distance = 20
scroll_friction = 1.0
scroll_stoptime = 300

# Text input settings
textinput_unfocus_on_touch = 1

[network]
# Network configuration for weather and other services
useragent = BedrockApp/1.0 (Raspberry Pi 5)
timeout = 30

[modules]
# Disable unnecessary modules for better performance
touchring = 
webdebugger = 
monitor = 

[clock]
# Clock settings for consistent timing
max_iteration = 20