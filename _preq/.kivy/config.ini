[graphics]
maxfps = 30
multisamples = 2
fullscreen = 0
borderless = 1
window_state = visible
minimum_width = 1024
minimum_height = 600
display = -1
position = custom
top = 0
left = 0

[input]
mouse = mouse
%(name)s = probesysfs,provider=mouse

[kivy]
log_level = info
log_enable = 1
log_dir = logs
log_name = kivy_%y-%m-%d_%_.txt
window_icon = 
desktop = 1
exit_on_escape = 1

[postproc]
double_tap_time = 250
double_tap_distance = 20